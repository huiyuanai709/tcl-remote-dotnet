name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  glibc-and-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            asset: tcl-remote-linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            asset: tcl-remote-linux-arm64
          - os: windows-2022
            rid: win-x64
            asset: tcl-remote-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        run: dotnet publish src/TclRemote/TclRemote.csproj -c Release -r ${{ matrix.rid }} -o publish --nologo

      - name: Stage asset
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp publish/tcl-remote.exe "${{ matrix.asset }}"
          else
            cp publish/tcl-remote "${{ matrix.asset }}"
            chmod +x "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  musl-and-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image_arch: amd64
            asset: tcl-remote-linux-musl-x64
          - os: ubuntu-24.04-arm
            image_arch: aarch64
            asset: tcl-remote-linux-musl-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Image version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on image on this architecture
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          image="ghcr.io/huiyuanai709/tcl-remote-${{ matrix.image_arch }}"
          docker build -f tcl-remote/Dockerfile \
            -t "${image}:${version}" \
            -t "${image}:latest" \
            .

      - name: Extract musl binary
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          image="ghcr.io/huiyuanai709/tcl-remote-${{ matrix.image_arch }}:${version}"
          cid="$(docker create "$image")"
          docker cp "$cid:/usr/bin/tcl-remote" "${{ matrix.asset }}"
          docker rm "$cid"
          chmod +x "${{ matrix.asset }}"

      - name: Push image
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          image="ghcr.io/huiyuanai709/tcl-remote-${{ matrix.image_arch }}"
          docker push "${image}:${version}"
          docker push "${image}:latest"

      - name: Mark package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/user/packages/container/tcl-remote-${{ matrix.image_arch }}" \
            -f visibility=public || \
          gh api --method PATCH -H "Accept: application/vnd.github+json" \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/tcl-remote-${{ matrix.image_arch }}" \
            -f visibility=public || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  github-release:
    needs: [glibc-and-windows, musl-and-image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -eu
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
